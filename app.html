<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>NEXORA PROMPTS</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0A0912" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NEXORA PROMPTS" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0A0912;
    font-family: 'Inter', sans-serif;
    color: #F2F0F7;
    padding-bottom: 84px;
  }
  ::placeholder { color: #6B6779; }
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(10,9,18,0.92);
    backdrop-filter: blur(8px);
    padding: 18px 16px 12px;
    border-bottom: 1px solid #1D1A28;
  }
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .mark { width: 34px; height: 34px; border-radius: 10px; background: #15131F; border: 1px solid #262233; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; }
  .wordmark-accent { background: linear-gradient(90deg, #8B5CF6, #22D3EE); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .tabs-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 4px; scrollbar-width: none; }
  .tabs-row::-webkit-scrollbar { display: none; }
  .tab-chip {
    flex-shrink: 0; background: #15131F; border: 1px solid #262233; border-radius: 999px;
    padding: 7px 14px; color: #9691A8; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .tab-chip.active { background: linear-gradient(90deg, #8B5CF6, #22D3EE); border: 1px solid transparent; color: #0A0912; font-weight: 700; }
  .search-wrap { display: flex; align-items: center; gap: 8px; background: #15131F; border: 1px solid #262233; border-radius: 12px; padding: 10px 12px; }
  .search-wrap input { background: transparent; border: none; outline: none; color: #F2F0F7; font-size: 14px; font-family: 'Inter', sans-serif; width: 100%; }
  main { padding: 16px 12px 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    position: relative; border-radius: 14px; overflow: hidden; border: 1px solid #262233;
    background: #15131F; padding: 0; cursor: pointer; aspect-ratio: 3 / 4; display: block; width: 100%;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 10px 9px; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent); }
  .card-prompt { font-size: 11.5px; color: #F2F0F7; text-align: left; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
  .empty-state { text-align: center; padding: 70px 24px; }
  .empty-icon { font-size: 30px; background: linear-gradient(90deg, #8B5CF6, #22D3EE); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .empty-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; margin-bottom: 6px; }
  .empty-text { color: #8B87A0; font-size: 13.5px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(6,5,11,0.85); backdrop-filter: blur(3px); display: none; align-items: flex-end; z-index: 20; }
  .modal-bg.show { display: flex; }
  .modal-card { width: 100%; background: #15131F; border-top-left-radius: 20px; border-top-right-radius: 20px; border: 1px solid #262233; border-bottom: none; max-height: 88vh; overflow-y: auto; }
  .modal-card img { width: 100%; max-height: 360px; object-fit: cover; display: block; }
  .modal-body { padding: 18px; }
  .modal-category { display: inline-block; font-size: 11.5px; font-weight: 700; color: #22D3EE; background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.3); border-radius: 999px; padding: 4px 10px; margin-bottom: 12px; }
  .modal-prompt { font-size: 14.5px; line-height: 1.55; color: #F2F0F7; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; }
  .copy-btn { flex: 1; background: linear-gradient(90deg, #8B5CF6, #22D3EE); border: none; border-radius: 12px; padding: 12px 0; color: #0A0912; font-weight: 700; font-size: 14px; font-family: 'Space Grotesk', sans-serif; cursor: pointer; }
  .close-btn { background: #0F0D17; border: 1px solid #262233; border-radius: 12px; padding: 12px 18px; color: #C9C5D6; font-weight: 600; font-size: 14px; cursor: pointer; }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,9,18,0.95); border-top: 1px solid #1D1A28; padding: 10px 0 14px; display: flex; justify-content: center; }
  .tab-active { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab-label-active { font-size: 11px; color: #22D3EE; font-weight: 600; }
  .install-banner {
    display: none; align-items: center; gap: 10px; background: #15131F; border: 1px solid #262233;
    border-radius: 12px; padding: 10px 12px; margin: 0 12px 12px;
  }
  .install-banner.show { display: flex; }
  .install-banner button { margin-left: auto; background: linear-gradient(90deg, #8B5CF6, #22D3EE); border: none; border-radius: 8px; padding: 7px 12px; color: #0A0912; font-weight: 700; font-size: 12.5px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L14.2 9.2L21 12L14.2 14.8L12 22L9.8 14.8L3 12L9.8 9.2L12 2Z" fill="url(#g2)" />
        <defs><linearGradient id="g2" x1="3" y1="2" x2="21" y2="22"><stop offset="0" stop-color="#8B5CF6" /><stop offset="1" stop-color="#22D3EE" /></linearGradient></defs>
      </svg>
    </div>
    <div class="wordmark">NEXORA <span class="wordmark-accent">PROMPTS</span></div>
  </div>
  <div class="tabs-row" id="tabsRow">
    <button class="tab-chip active" data-cat="All">All</button>
    <button class="tab-chip" data-cat="New">New</button>
    <button class="tab-chip" data-cat="Trending">Trending</button>
    <button class="tab-chip" data-cat="Videos">Videos</button>
    <button class="tab-chip" data-cat="Kids">Kids</button>
    <button class="tab-chip" data-cat="Games">Games</button>
    <button class="tab-chip" data-cat="DP Maker">DP Maker</button>
    <button class="tab-chip" data-cat="Sticker Maker">Sticker Maker</button>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;">
      <circle cx="11" cy="11" r="7" stroke="#8B87A0" stroke-width="2" />
      <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#8B87A0" stroke-width="2" stroke-linecap="round" />
    </svg>
    <input id="searchInput" placeholder="Prompts search karein…" />
  </div>
</header>

<div class="install-banner" id="installBanner">
  <span style="font-size:13px; color:#C9C5D6;">Home screen par install karein</span>
  <button id="installBtn">Install</button>
</div>

<main>
  <div class="empty-state" id="loadingState"><div class="empty-text">Loading…</div></div>
  <div class="grid" id="grid" style="display:none;"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">✧</div>
    <div class="empty-title" id="emptyTitle">Abhi koi prompt nahi hai</div>
    <div class="empty-text" id="emptyText">NEXORA FORM se apna pehla prompt publish karein.</div>
  </div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal-card" onclick="event.stopPropagation()">
    <img id="modalImg" src="" alt="" />
    <div class="modal-body">
      <div class="modal-category" id="modalCategory"></div>
      <div class="modal-prompt" id="modalPrompt"></div>
      <div class="modal-actions">
        <button class="copy-btn" id="copyBtn">Copy prompt</button>
        <button class="close-btn" id="closeBtn">Band karein</button>
      </div>
    </div>
  </div>
</div>

<nav class="tabbar">
  <div class="tab-active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="7" height="7" rx="2" stroke="#22D3EE" stroke-width="2" />
      <rect x="14" y="3" width="7" height="7" rx="2" stroke="#22D3EE" stroke-width="2" />
      <rect x="3" y="14" width="7" height="7" rx="2" stroke="#22D3EE" stroke-width="2" />
      <rect x="14" y="14" width="7" height="7" rx="2" stroke="#22D3EE" stroke-width="2" />
    </svg>
    <span class="tab-label-active">Gallery</span>
  </div>
</nav>

<script type="module">
  import { db } from "./firebase-config.js";
  import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const grid = document.getElementById('grid');
  const loadingState = document.getElementById('loadingState');
  const emptyState = document.getElementById('emptyState');
  const emptyTitle = document.getElementById('emptyTitle');
  const emptyText = document.getElementById('emptyText');
  const tabsRow = document.getElementById('tabsRow');
  const searchInput = document.getElementById('searchInput');
  const modalBg = document.getElementById('modalBg');
  const modalImg = document.getElementById('modalImg');
  const modalCategory = document.getElementById('modalCategory');
  const modalPrompt = document.getElementById('modalPrompt');
  const copyBtn = document.getElementById('copyBtn');
  const closeBtn = document.getElementById('closeBtn');

  let allItems = [];
  let currentTab = 'All';
  let currentQuery = '';

  const q = query(collection(db, 'prompts'), orderBy('createdAt', 'desc'));
  onSnapshot(q, (snap) => {
    allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadingState.style.display = 'none';
    render();
  }, (err) => {
    console.error(err);
    loadingState.innerHTML = '<div class="empty-text">Data load nahi ho saka. Internet check karein.</div>';
  });

  function render() {
    const filtered = allItems.filter(it => {
      const matchTab = currentTab === 'All' || it.category === currentTab;
      const matchQuery = (it.prompt || '').toLowerCase().includes(currentQuery.toLowerCase());
      return matchTab && matchQuery;
    });

    if (filtered.length === 0) {
      grid.style.display = 'none';
      emptyState.style.display = 'block';
      if (allItems.length === 0) {
        emptyTitle.textContent = 'Abhi koi prompt nahi hai';
        emptyText.textContent = 'NEXORA FORM se apna pehla prompt publish karein.';
      } else {
        emptyTitle.textContent = 'Kuch nahi mila';
        emptyText.textContent = 'Doosra category ya search try karein.';
      }
      return;
    }

    emptyState.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = filtered.map(item => `
      <button class="card" data-id="${item.id}">
        <img src="${item.image}" loading="lazy" />
        <div class="card-overlay"><div class="card-prompt">${escapeHtml(item.prompt || '')}</div></div>
      </button>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const item = allItems.find(it => it.id === card.dataset.id);
    if (!item) return;
    modalImg.src = item.image;
    modalCategory.textContent = item.category || '';
    modalPrompt.textContent = item.prompt || '';
    copyBtn.textContent = 'Copy prompt';
    copyBtn.dataset.text = item.prompt || '';
    modalBg.classList.add('show');
  });

  modalBg.addEventListener('click', () => modalBg.classList.remove('show'));
  closeBtn.addEventListener('click', () => modalBg.classList.remove('show'));
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(copyBtn.dataset.text || '');
    copyBtn.textContent = 'Copied ✓';
    setTimeout(() => copyBtn.textContent = 'Copy prompt', 1500);
  });

  tabsRow.addEventListener('click', (e) => {
    const chip = e.target.closest('.tab-chip');
    if (!chip) return;
    [...tabsRow.children].forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentTab = chip.dataset.cat;
    render();
  });

  searchInput.addEventListener('input', (e) => {
    currentQuery = e.target.value;
    render();
  });

  // PWA install prompt
  let deferredPrompt;
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBanner.classList.add('show');
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.classList.remove('show');
  });
  window.addEventListener('appinstalled', () => installBanner.classList.remove('show'));

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
